baseURL = "https://how-we-got-here.org/"
title = "How We Got There"
theme = "hugo-book"
enableGitInfo = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Multilingual via per-language contentDir (TRANSLATION_PLAN.md / hugo-book exampleSite).
[languages]
[languages.en]
  label = "English"
  locale = "en-us"
  contentDir = "content"
  weight = 1
  title = "How We Got There"

[languages.th]
  label = "ไทย"
  locale = "th"
  contentDir = "content.th"
  weight = 2
  title = "เราไปถึงจุดนั้นได้อย่างไร"

[languages.si]
  label = "සිංහල"
  locale = "si"
  contentDir = "content.si"
  weight = 3
  title = "අප එතැනට පැමිණි ආකාරය"

[languages.ta]
  label = "தமிழ்"
  locale = "ta"
  contentDir = "content.ta"
  weight = 4
  title = "நாம் அங்கு எப்படிச் சென்றடைந்தோம்"

# Chinese: co-authoritative source language (VISION.md, Language authority lock 2026-09-26).
# Simplified is the master text; Traditional is derived (OpenCC s2twp) + terminology review.
# `locale` is emitted as <html lang> by hugo-book, so keep the BCP 47 script subtags.
[languages.zh-hans]
  label = "简体中文"
  locale = "zh-Hans"
  contentDir = "content.zh-hans"
  weight = 5
  title = "我们如何走到那里"

[languages.zh-hant]
  label = "繁體中文"
  locale = "zh-Hant"
  contentDir = "content.zh-hant"
  weight = 6
  title = "我們如何走到那裡"

[languages.ro]
  label = "Română"
  locale = "ro"
  contentDir = "content.ro"
  weight = 7
  title = "Cum am ajuns acolo"

