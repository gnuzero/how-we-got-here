baseURL = "https://how-we-got-here.org/"
title = "From Relays to Attention: How We Got Here"
theme = "hugo-book"
enableGitInfo = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Multilingual via per-language contentDir (TRANSLATION_PLAN.md / hugo-book exampleSite).
[languages]
[languages.en]
  label = "English"
  locale = "en-us"
  contentDir = "content"
  weight = 1
  title = "From Relays to Attention: How We Got Here"

[languages.th]
  label = "ไทย"
  locale = "th"
  contentDir = "content.th"
  weight = 2
  title = "จากรีเลย์สู่ Attention: เรามาถึงจุดนี้อย่างไร"

[languages.si]
  label = "සිංහල"
  locale = "si"
  contentDir = "content.si"
  weight = 3
  title = "රිලේ සිට අවධානය දක්වා: අප මෙතැනට පැමිණි ආකාරය"

[languages.ta]
  label = "தமிழ்"
  locale = "ta"
  contentDir = "content.ta"
  weight = 4
  title = "ரிலேயிலிருந்து Attention வரை: நாம் இங்கு எப்படி வந்தோம்"

# Chinese: co-authoritative source language (VISION.md, Language authority lock 2026-09-26).
# Simplified is the master text; Traditional is derived (OpenCC s2twp) + terminology review.
# `locale` is emitted as <html lang> by hugo-book, so keep the BCP 47 script subtags.
[languages.zh-hans]
  label = "简体中文"
  locale = "zh-Hans"
  contentDir = "content.zh-hans"
  weight = 5
  title = "从继电器到注意力机制：我们如何走到今天"

[languages.zh-hant]
  label = "繁體中文"
  locale = "zh-Hant"
  contentDir = "content.zh-hant"
  weight = 6
  title = "從繼電器到注意力機制：我們如何走到今天"

[languages.ro]
  label = "Română"
  locale = "ro"
  contentDir = "content.ro"
  weight = 7
  title = "De la relee la Attention: cum am ajuns aici"

[params]
  # Site-wide <meta name="robots" content="noindex, nofollow"> via layouts/_partials/docs/inject/head.html.
  # true = emit tag (pre-launch default). false = emit nothing. Flip to false at announcement (one line).
  noindex = true
  BookSection = "posts"
  # Only list a language in the switcher when this page exists in that locale
  # (no silent fallback to that locale's home). Required so thin locales like ro
  # are not linked from pages they do not have.
  BookTranslatedOnly = true
  BookRepo = "https://github.com/gnuzero/how-we-got-here"
  # Footer "Open an issue" is in layouts/_partials/docs/footer.html
  BookLastChangeLink = "{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}"

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML/SVG inline for schematics

[markup.highlight]
  style = "monokai"
  lineNos = true
