[params]
  # Site-wide <meta name="robots" content="noindex, nofollow"> via layouts/_partials/docs/inject/head.html.
  # true = emit tag (pre-launch default). false = emit nothing. Flip to false at announcement (one line).
  noindex = true
  BookSection = "posts"
  # Only list a language in the switcher when this page exists in that locale
  # (no silent fallback to that locale's home). Required so thin locales like ro
  # are not linked from pages they do not have.
  BookTranslatedOnly = true
  BookRepo = "https://github.com/gnuzero/how-we-got-here"
  # Footer "Open an issue" is in layouts/_partials/docs/footer.html
  BookLastChangeLink = "{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}"

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML/SVG inline for schematics

[markup.highlight]
  style = "monokai"
  lineNos = true
